<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pôster 1 — Impacto Visual</title>
<link rel="stylesheet" href="tokens.css">
<style>
  /* ============================================================
     PÔSTER 1 — IMPACTO VISUAL
     Asymmetric brutalist grid · 12-column modular system
     Hard-left anchor · 96px left margin · 8pt baseline rhythm
     ============================================================ */

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: var(--color-surface);
    font-family: var(--font-display, 'Arial Black', sans-serif);
    color: var(--color-ink);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  /* ---------- POSTER FRAME ---------- */
  .poster {
    width: 1080px;
    height: 1350px;
    position: relative;
    overflow: hidden;
    background: var(--color-surface);
    display: grid;
    grid-template-columns: 96px repeat(12, 1fr) 96px;
    grid-template-rows: repeat(12, 1fr);
    gap: 0;
  }

  /* ---------- NEGATIVE SPACE / TAPE ZONE (top-right) ---------- */
  .tape-zone {
    grid-column: 9 / 14;
    grid-row: 1 / 4;
    position: relative;
    z-index: 5;
    pointer-events: none;
  }

  /* The tape/xarpi intervention — diagonal crossing */
  .tape-strip {
    position: absolute;
    top: -40px;
    right: -60px;
    width: 420px;
    height: 48px;
    background: var(--color-accent, #c96f4a);
    transform: rotate(-38deg);
    opacity: 0.85;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    z-index: 10;
  }

  .tape-strip::after {
    content: '';
    position: absolute;
    top: 6px;
    left: 8px;
    right: 8px;
    bottom: 6px;
    background: repeating-linear-gradient(
      90deg,
      transparent 0px,
      transparent 14px,
      rgba(255,255,255,0.12) 14px,
      rgba(255,255,255,0.12) 16px
    );
  }

  /* ---------- IMAGE / MATERIALITY FIELD ---------- */
  .material-field {
    grid-column: 1 / 14;
    grid-row: 1 / 6;
    position: relative;
    overflow: hidden;
    z-index: 1;
  }

  .material-field img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    filter: grayscale(0.9) contrast(1.15) brightness(0.85);
  }

  /* Concrete grain overlay */
  .material-field::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 30%, rgba(0,0,0,0.35), transparent 60%),
      radial-gradient(ellipse at 80% 70%, rgba(0,0,0,0.25), transparent 50%);
    mix-blend-mode: multiply;
    pointer-events: none;
  }

  /* ---------- MONOLITH TYPOGRAPHIC BLOCK ----------
     Anchored at golden-mean horizontal cut (61.8% from top)
     Lower two-thirds of the poster. */
  .monolith-block {
    grid-column: 1 / 14;
    grid-row: 7 / 13;
    position: relative;
    z-index: 3;
    padding: 0 96px 0 96px;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: flex-start;
    background: var(--color-surface);
  }

  /* Vertical rule — structural spine */
  .monolith-block::before {
    content: '';
    position: absolute;
    top: 0;
    left: 96px;
    width: 2px;
    height: 100%;
    background: var(--color-ink);
    opacity: 0.15;
  }

  /* ---------- HEADLINE — monumental, overflows right edge ---------- */
  .headline {
    font-family: var(--font-display, 'Arial Black', sans-serif);
    font-size: clamp(96px, 11vw, 148px);
    font-weight: 900;
    line-height: 0.82;
    letter-spacing: -0.04em;
    text-transform: uppercase;
    color: var(--color-ink);
    margin-top: 48px;
    margin-bottom: 32px;
    max-width: none;
    white-space: nowrap;
    transform: translateX(0);
    /* Overflow the right boundary */
    width: calc(100% + 96px);
    margin-right: -96px;
  }

  .headline .line-break {
    display: block;
  }

  /* Terracotta accent word — where rust decides to enter */
  .headline .rust-accent {
    color: var(--color-accent, #c96f4a);
    font-style: italic;
    font-weight: 900;
  }

  /* ---------- EDITORIAL BODY ---------- */
  .editorial-body {
    font-family: var(--font-body, Georgia, serif);
    font-size: 18px;
    line-height: 1.6;
    max-width: 520px;
    color: var(--color-ink);
    opacity: 0.85;
    margin-top: 16px;
    padding-left: 48px;
    border-left: 3px solid var(--color-accent, #c96f4a);
  }

  .editorial-body blockquote {
    font-style: italic;
    margin: 0;
    padding: 0;
  }

  /* ---------- CAPTION / LEGEND ---------- */
  .caption {
    position: absolute;
    bottom: 48px;
    right: 96px;
    font-family: var(--font-mono, 'Courier New', monospace);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--color-ink);
    opacity: 0.6;
    max-width: 280px;
    text-align: right;
    z-index: 6;
  }

  /* ---------- GOLDEN-MEAN GUIDE (invisible structural marker) ---------- */
  .golden-cut {
    position: absolute;
    top: 61.8%;
    left: 0;
    right: 0;
    height: 1px;
    background: transparent;
    z-index: 0;
  }

  /* ---------- RESPONSIVE (scale down for smaller viewports) ---------- */
  @media (max-width: 1100px) {
    .poster {
      width: 100vw;
      height: 125vw;
      grid-template-columns: 48px repeat(12, 1fr) 48px;
    }
    .monolith-block {
      padding: 0 48px 0 48px;
    }
    .monolith-block::before {
      left: 48px;
    }
    .headline {
      font-size: clamp(64px, 9vw, 110px);
      width: calc(100% + 48px);
      margin-right: -48px;
    }
    .caption {
      right: 48px;
      bottom: 32px;
    }
  }

  @media (max-width: 640px) {
    .poster {
      grid-template-columns: 24px repeat(12, 1fr) 24px;
    }
    .monolith-block {
      padding: 0 24px 0 24px;
    }
    .monolith-block::before {
      left: 24px;
    }
    .headline {
      font-size: clamp(48px, 8vw, 72px);
      white-space: normal;
      width: 100%;
      margin-right: 0;
    }
    .editorial-body {
      padding-left: 24px;
      font-size: 15px;
    }
    .caption {
      right: 24px;
      bottom: 24px;
      font-size: 9px;
    }
    .tape-strip {
      width: 280px;
      height: 36px;
    }
  }
</style>
</head>
<body>

<article class="poster" role="img" aria-label="Pôster 1 — Impacto Visual: A letra não ilustra o muro — ela o ocupa.">

  <!-- Golden-mean structural marker (invisible) -->
  <div class="golden-cut" aria-hidden="true"></div>

  <!-- Materiality field: concrete texture image -->
  <figure class="material-field">
    <img
      src="https://images.unsplash.com/photo-1616422285623-146698dc96a5?q=80&w=1080&auto=format&fit=crop"
      alt="Textura de concreto bruto — superfície como empena"
      loading="eager"
    />
  </figure>

  <!-- Tape/xarpi intervention — top-right negative space -->
  <div class="tape-zone" aria-hidden="true">
    <div class="tape-strip"></div>
  </div>

  <!-- Monolith typographic block — lower two-thirds -->
  <section class="monolith-block">
    <h1 class="headline">
      <span class="line-break">A LETRA</span>
      <span class="line-break">NÃO ILUSTRA</span>
      <span class="line-break">O MURO —</span>
      <span class="line-break">ELA O <span class="rust-accent">OCUPA</span></span>
    </h1>

    <div class="editorial-body">
      <blockquote>
        Superfície como empena, tipografia como volume escavado,
        e um único respiro terracota onde a ferrugem decide entrar.
      </blockquote>
    </div>
  </section>

  <!-- Caption / legend -->
  <footer class="caption">
    Pôster 01 — Impacto Visual<br>
    Materialidade sem clichês · 1080×1350
  </footer>

</article>

</body>
</html>
