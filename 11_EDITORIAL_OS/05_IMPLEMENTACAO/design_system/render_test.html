<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EOS-002: Token Render Validation</title>
    <!-- Importando fontes baseadas nos tokens (Space Grotesk e Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;800&family=Space+Grotesk:wght@400;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="tokens.css">
    
    <style>
        /* 
         * ESTE NÃO É UM COMPONENTE DO DESIGN SYSTEM. 
         * É apenas uma folha de estilo de calibração para forçar a renderização
         * das variáveis e garantir que o CSS parses corretamente no browser.
         */
        body {
            background-color: var(--color-base-black);
            color: var(--color-base-offwhite);
            font-family: var(--font-secondary);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: var(--spacing-base);
            min-height: 100vh;
        }
        
        h2 {
            font-family: var(--font-primary);
            font-weight: var(--font-weight-heavy);
            margin-bottom: var(--spacing-base);
        }
        
        iframe {
            width: 1080px;
            height: 1350px;
            border: none;
            transform: scale(0.6); /* Escala para caber na maioria dos monitores na horizontal */
            transform-origin: top center;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <h2>EOS-003: Render Validation (Base Poster Template)</h2>
    
    <iframe src="templates/base-poster.html" title="Base Poster Preview"></iframe>

</body>
</html>
