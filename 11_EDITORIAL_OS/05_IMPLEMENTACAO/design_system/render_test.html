<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EOS-002: Token Render Validation</title>
    <!-- Importando fontes baseadas nos tokens (Space Grotesk e Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;800&family=Space+Grotesk:wght@400;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="tokens.css">
    
    <style>
        /* 
         * ESTE NÃO É UM COMPONENTE DO DESIGN SYSTEM. 
         * É apenas uma folha de estilo de calibração para forçar a renderização
         * das variáveis e garantir que o CSS parses corretamente no browser.
         */
        body {
            background-color: var(--color-base-offwhite);
            color: var(--color-base-black);
            font-family: var(--font-secondary);
            font-size: var(--font-size-body);
            margin: var(--spacing-massive); /* Testando spacing */
            padding: var(--spacing-base);
        }
        
        .test-box {
            background-color: var(--color-base-black);
            color: var(--color-base-offwhite);
            padding: var(--spacing-large);
            border-radius: var(--radius-square); /* Testando formas duras */
            margin-bottom: var(--spacing-base);
        }
        
        h1 {
            font-family: var(--font-primary);
            font-size: var(--font-size-h1-colossal);
            font-weight: var(--font-weight-heavy);
            margin-bottom: var(--spacing-tight);
            line-height: 0.9;
        }
        
        h2 {
            font-family: var(--font-primary);
            font-size: var(--font-size-h3);
            margin-bottom: var(--spacing-base);
        }
    </style>
</head>
<body>

    <h1>HIGH HOUSE</h1>
    <h2>Design System Tokens: Render Test (EOS-002)</h2>
    
    <div class="test-box">
        Essa caixa testa a inversão de cores primárias (--color-base-black / --color-base-offwhite), 
        espaçamento interno (--spacing-large) e bordas geométricas rígidas (--radius-square).
    </div>

    <p style="font-family: var(--font-experimental);">
        Tipografia experimental fallback.
    </p>

</body>
</html>
